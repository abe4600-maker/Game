<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🌟 わくわく おえかき スタジオ 🌟</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #fff9db;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #f08c00; font-size: 28px; margin-bottom: 5px; }
        p.subtitle { color: #555; margin-top: 0; font-size: 15px; }

        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        /* ツールバー */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 12px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
        }
        .tool-btn, .color-btn {
            padding: 8px 14px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            transition: 0.1s;
        }
        .tool-btn.active {
            background: #ffec99;
            border-color: #f59f00;
        }
        .color-btn {
            width: 35px;
            height: 35px;
            padding: 0;
            border-radius: 50%;
        }

        /* キャンバス */
        canvas {
            border: 4px solid #ced4da;
            border-radius: 16px;
            background-color: #ffffff;
            cursor: crosshair;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 作品情報エリア */
        .info-area {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        input[type="text"] {
            padding: 10px 14px;
            font-size: 16px;
            border: 2px solid #ced4da;
            border-radius: 10px;
            width: 220px;
        }
        .btn-save {
            background-color: #51cf66;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(81,207,102,0.4);
        }
        .btn-save:hover { background-color: #40c057; }
        .btn-clear {
            background-color: #ff6b6b;
            color: white;
            font-size: 14px;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* ギャラリー（下の棚） */
        .gallery-section {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: left;
        }
        .gallery-section h2 { font-size: 18px; color: #333; text-align: center; margin-top: 0; }
        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .gallery-card {
            background: #fff3bf;
            border: 2px solid #ffe066;
            border-radius: 12px;
            padding: 10px;
            width: 120px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .gallery-card:hover { transform: translateY(-3px); }
        .mini-preview {
            width: 100px;
            height: 70px;
            background: white;
            border-radius: 8px;
            margin: 0 auto 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #888;
            border: 1px solid #dee2e6;
            position: relative;
            overflow: hidden;
        }
        .gallery-card p { font-size: 13px; font-weight: bold; margin: 5px 0 0; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .empty-msg { color: #8b8b8b; text-align: center; font-size: 14px; width: 100%; }
    </style>
</head>
<body>

    <h1>🎨 わくわく おえかき スタジオ 🎨</h1>
    <p class="subtitle">すきな形を置いたり、色をぬって自分だけの絵を作ろう！</p>

    <div class="app-container">
        <!-- ツール選択エリア -->
        <div class="toolbar">
            <span style="font-weight:bold; line-height:35px; margin-right:5px;">ツール:</span>
            <button class="tool-btn active" onclick="setTool('stamp', 'circle')">⭕ まる</button>
            <button class="tool-btn" onclick="setTool('stamp', 'rect')">⬛ 四角</button>
            <button class="tool-btn" onclick="setTool('stamp', 'star')">⭐ ほし</button>
            <button class="tool-btn" onclick="setTool('stamp', 'heart')">💖 ハート</button>
            <button class="tool-btn" onclick="setTool('template', 'dog')">🐶 いぬ(ぬりえ)</button>
            <button class="tool-btn" onclick="setTool('template', 'car')">🚗 くるま(ぬりえ)</button>
            <button class="tool-btn" onclick="setTool('template', 'house')">🏠 おうち(ぬりえ)</button>
        </div>

        <!-- カラー選択エリア -->
        <div class="toolbar">
            <span style="font-weight:bold; line-height:35px; margin-right:5px;">いろ:</span>
            <button class="color-btn" style="background: #ff6b6b;" onclick="setColor('#ff6b6b')"></button>
            <button class="color-btn" style="background: #ffa94d;" onclick="setColor('#ffa94d')"></button>
            <button class="color-btn" style="background: #fcc419;" onclick="setColor('#fcc419')"></button>
            <button class="color-btn" style="background: #51cf66;" onclick="setColor('#51cf66')"></button>
            <button class="color-btn" style="background: #339af0;" onclick="setColor('#339af0')"></button>
            <button class="color-btn" style="background: #cc5de8;" onclick="setColor('#cc5de8')"></button>
            <button class="color-btn" style="background: #868e96;" onclick="setColor('#868e96')"></button>
            <button class="color-btn" style="background: #212529;" onclick="setColor('#212529')"></button>
        </div>

        <!-- お絵描きキャンバス -->
        <canvas id="artCanvas" width="450" height="300"></canvas>

        <!-- 作品名と保存ボタン -->
        <div class="info-area">
            <input type="text" id="workName" placeholder="作品の名前（例：ぼくのいぬ）" value="はじめての作品">
            <button class="btn-save" onclick="saveWork()">💾 かざる！</button>
            <button class="btn-clear" onclick="clearCanvas()">ぜんぶ消す</button>
        </div>
    </div>

    <!-- 作品コレクション（下の棚） -->
    <div class="gallery-section">
        <h2>🏆 じぶんの 作品かざりばこ（クリックで編集できるよ！）</h2>
        <div class="gallery-grid" id="galleryGrid">
            <div class="empty-msg">まだ作品がありません。つくったら「かざる！」を押してね！</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');
        const nameInput = document.getElementById('workName');
        const galleryGrid = document.getElementById('galleryGrid');

        let currentMode = 'stamp'; // 'stamp' または 'template'
        let currentShape = 'circle'; // 'circle', 'rect', 'star', 'heart', またはテンプレート名
        let currentColor = '#ff6b6b';
        
        // 配置したオブジェクト（スタンプやテンプレートの図形）を保存するリスト
        let elements = [];
        // 保存された作品のコレクション
        let savedWorks = [];
        // 現在編集中の作品ID（新規なら null）
        let editingIndex = null;

        function setTool(mode, shape) {
            currentMode = mode;
            currentShape = shape;

            // ボタンの見た目アクティブ切替
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'template') {
                loadTemplate(shape);
            }
        }

        function setColor(color) {
            currentColor = color;
        }

        // テンプレートを読み込む
        function loadTemplate(templateType) {
            elements = []; // 一旦クリア
            if (templateType === 'dog') {
                nameInput.value = "かわいい犬";
                // いぬの構成要素（わく組み）
                elements.push({type: 'circle', x: 225, y: 160, size: 100, color: '#f8f9fa', stroke: '#333'}); // 顔
                elements.push({type: 'triangle', x1: 165, y1: 110, x2: 150, y2: 60, x3: 195, y3: 90, color: '#f8f9fa', stroke: '#333'}); // 左耳
                elements.push({type: 'triangle', x1: 285, y1: 110, x2: 300, y2: 60, x3: 255, y3: 90, color: '#f8f9fa', stroke: '#333'}); // 右耳
                elements.push({type: 'circle', x: 195, y: 140, size: 15, color: '#333'}); // 左目
                elements.push({type: 'circle', x: 255, y: 140, size: 15, color: '#333'}); // 右目
                elements.push({type: 'circle', x: 225, y: 175, size: 20, color: '#333'}); // 鼻
            } else if (templateType === 'car') {
                nameInput.value = "かっこいい車";
                elements.push({type: 'rect', x: 125, y: 150, w: 200, h: 70, color: '#f8f9fa', stroke: '#333'}); // 車体下
                elements.push({type: 'rect', x: 175, y: 100, w: 100, h: 50, color: '#f8f9fa', stroke: '#333'}); // 車体上
                elements.push({type: 'circle', x: 165, y: 220, size: 25, color: '#333'}); // タイヤ左
                elements.push({type: 'circle', x: 285, y: 220, size: 25, color: '#333'}); // タイヤ右
            } else if (templateType === 'house') {
                nameInput.value = "すてきなお家";
                elements.push({type: 'rect', x: 150, y: 150, w: 150, h: 120, color: '#f8f9fa', stroke: '#333'}); // 家の本体
                elements.push({type: 'triangle', x1: 225, y1: 70, x2: 130, y2: 150, x3: 320, y3: 150, color: '#f8f9fa', stroke: '#333'}); // 屋根
                elements.push({type: 'rect', x: 200, y: 200, w: 50, h: 70, color: '#f8f9fa', stroke: '#333'}); // ドア
            }
            redrawCanvas();
        }

        // キャンバスをクリックしたとき（スタンプを配置または色を塗る）
        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            if (currentMode === 'stamp') {
                // スタンプを配置
                elements.push({
                    type: currentShape,
                    x: x,
                    y: y,
                    size: 40,
                    w: 70,
                    h: 50,
                    color: currentColor
                });
            } else {
                // テンプレートモードのときは、クリックした場所にあるパーツの色を現在の色に変更（ぬりえ感覚）
                for (let i = elements.length - 1; i >= 0; i--) {
                    if (isHitElement(x, y, elements[i])) {
                        elements[i].color = currentColor;
                        break;
                    }
                }
            }
            redrawCanvas();
        });

        // パーツにヒットしたか判定
        function isHitElement(x, y, el) {
            if (el.type === 'circle') {
                const dist = Math.hypot(x - el.x, y - el.y);
                return dist <= (el.size || 30);
            } else if (el.type === 'rect') {
                return x >= el.x && x <= el.x + (el.w || 60) && y >= el.y && y <= el.y + (el.h || 60);
            }
            // 簡易的に全体の範囲で判定
            return Math.hypot(x - el.x, y - el.y) < 40;
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            elements.forEach(el => {
                ctx.fillStyle = el.color;
                ctx.strokeStyle = el.stroke || '#000';
                ctx.lineWidth = 2;

                if (el.type === 'circle') {
                    ctx.beginPath();
                    ctx.arc(el.x, el.y, el.size || 30, 0, Math.PI * 2);
                    ctx.fill();
                    if (el.stroke) ctx.stroke();
                } else if (el.type === 'rect') {
                    const w = el.w || 60;
                    const h = el.h || 60;
                    ctx.fillRect(el.x, el.y, w, h);
                    if (el.stroke) ctx.stroke();
                } else if (el.type === 'star') {
                    drawStar(el.x, el.y, 5, el.size || 35, (el.size || 35) / 2);
                } else if (el.type === 'heart') {
                    drawHeart(el.x, el.y, el.size || 35);
                } else if (el.type === 'triangle') {
                    ctx.beginPath();
                    ctx.moveTo(el.x1, el.y1);
                    ctx.lineTo(el.x2, el.y2);
                    ctx.lineTo(el.x3, el.y3);
                    ctx.closePath();
                    ctx.fill();
                    if (el.stroke) ctx.stroke();
                }
            });
        }

        // 星を描くヘルパー
        function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        // ハートを描くヘルパー
        function drawHeart(x, y, size) {
            ctx.beginPath();
            let topCurveHeight = size * 0.3;
            ctx.moveTo(x, y + topCurveHeight);
            // 左のカーブ
            ctx.bezierCurveTo(x, y, x - size, y, x - size, y + topCurveHeight);
            ctx.bezierCurveTo(x - size, y + (size + topCurveHeight) / 2, x, y + (size * 0.9), x, y + size);
            // 右のカーブ
            ctx.bezierCurveTo(x, y + (size * 0.9), x + size, y + (size + topCurveHeight) / 2, x + size, y + topCurveHeight);
            ctx.bezierCurveTo(x + size, y, x, y, x, y + topCurveHeight);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function clearCanvas() {
            elements = [];
            redrawCanvas();
        }

        // 作品を保存する（新規追加または上書き編集）
        function saveWork() {
            const name = nameInput.value || "名無しの作品";
            // キャンバスの状態をコピーして保存
            const workData = {
                name: name,
                elements: JSON.parse(JSON.stringify(elements))
            };

            if (editingIndex !== null) {
                // 編集中のものを上書き
                savedWorks[editingIndex] = workData;
                editingIndex = null;
            } else {
                // 新規追加
                savedWorks.push(workData);
            }

            updateGallery();
            alert(`「${name}」をかざりばこに保存したよ！`);
        }

        // ギャラリー（下の棚）を更新
        function updateGallery() {
            if (savedWorks.length === 0) {
                galleryGrid.innerHTML = '<div class="empty-msg">まだ作品がありません。つくったら「かざる！」を押してね！</div>';
                return;
            }

            galleryGrid.innerHTML = '';
            savedWorks.forEach((work, index) => {
                const card = document.createElement('div');
                card.className = 'gallery-card';
                card.onclick = () => editWork(index);

                // ミニプレビュー用のテキストまたはアイコン
                card.innerHTML = `
                    <div class="mini-preview">
                        <span style="font-size:11px; font-weight:bold; color:#555;">${work.name}</span>
                    </div>
                    <p>${work.name}</p>
                `;
                galleryGrid.appendChild(card);
            });
        }

        // 保存された作品を呼び出して編集モードにする
        function editWork(index) {
            const work = savedWorks[index];
            nameInput.value = work.name;
            elements = JSON.parse(JSON.stringify(work.elements));
            editingIndex = index;
            redrawCanvas();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 初期状態
        redrawCanvas();
    </script>
</body>
</html>
